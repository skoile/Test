<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Ma ToDo list</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main>
    <h1>Ma ToDo list</h1>
    <form id="form">
      <input id="input" type="text" placeholder="Nouvelle tâche..." autocomplete="off" required>
      <button type="submit">Ajouter</button>
    </form>
    <ul id="list"></ul>
    <p id="empty" class="empty">Aucune tâche pour l'instant.</p>
  </main>
  <script src="app.js"></script>
</body>
</html>
